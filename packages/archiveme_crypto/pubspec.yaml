name: archiveme_crypto
description: >-
  At-rest encryption and key-material handling for ArchiveMe
  (AES-256-GCM vault/JSON envelopes; 32-byte keychain keys).
  Must not depend on archiveme_mobile.
publish_to: "none"
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.7.0
  encrypt: ^5.0.3
  uuid: ^4.5.1

dev_dependencies:
  test: ^1.31.0

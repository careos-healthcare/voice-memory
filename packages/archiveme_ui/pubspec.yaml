name: archiveme_ui
description: >-
  Shared ArchiveMe UI widgets and tightly coupled view models.
  Used by the mobile app and research surfaces. Must not depend on
  archiveme_mobile (avoids a package cycle).
publish_to: "none"
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

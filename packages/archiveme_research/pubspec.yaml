name: archiveme_research
description: >-
  Non-shipping ArchiveMe research and lab surfaces (capacity loop, beta labs,
  legacy archive experiments). Not imported by the V1 production app graph.
publish_to: "none"
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archiveme_mobile:
    path: ../../apps/mobile
  archiveme_ui:
    path: ../archiveme_ui
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  pointycastle: ^3.7.4
  source_gen: ^4.0.0
  freezed_annotation: ^3.0.0

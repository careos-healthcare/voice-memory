name: ArchiveMe stabilization

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

concurrency:
  group: archiveme-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: npm ci integrity
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Server build
        run: npm run build:server
      - name: Server tests
        run: npm run validate:auth-security
      - name: Privacy log validation
        run: npm run validate:privacy-logs || node scripts/validate-privacy-logs.mjs
      - name: Insight quality gate (PRD Goal #4 — ordered validators)
        run: npm run validate:insight-quality-gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Product restraint (consolidated)
        run: npm run validate:restraint
      - name: Blind-spot validation (consolidated)
        run: npm run validate:blind-spot
      - name: Resurfacing validation (consolidated)
        run: npm run validate:resurfacing
      - name: Clinical quarantine audit
        run: npm run validate:clinical-quarantine

  flutter-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: Audit silent catch blocks
        run: python3 tool/run_gate.py audits silent_catches
      - name: dart format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: analyzer baseline
        run: bash tool/validate_analyzer_baseline.sh
      - name: research import guard
        run: bash tool/validate_no_research_imports.sh
      - name: feature module count budget
        run: python3 tool/run_gate.py budget
      - name: V1 production graph and permissions
        run: bash tool/validate_v1_production_graph.sh
      - name: validate core (analyzer + full test suite + release gates)
        run: bash tool/validate_core.sh
      - name: Insight-science theory dart suites
        run: flutter test test/archive_theory_engine_test.dart test/theory_ranking_engine_test.dart test/archive_agreement_service_test.dart test/archive_primary_theory_validation_test.dart test/archive_quality_validation_test.dart
      - name: repository cleanliness
        run: bash tool/validate_repository_cleanliness.sh

  flutter-android:
    runs-on: ubuntu-latest
    needs: flutter-gates
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android debug build
        run: flutter build apk --debug

  flutter-ios:
    runs-on: macos-latest
    needs: flutter-gates
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pod install
        run: |
          cd ios
          pod install
      - name: iOS simulator build (no signing)
        run: flutter build ios --simulator --no-codesign

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret pattern scan
        run: |
          ! git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk_live_[A-Za-z0-9]{8,}|AKIA[0-9A-Z]{16})' \
            -- ':!*.md' ':!package-lock.json' ':!pubspec.lock' \
               ':!.github/**' ':!**/test/**' ':!scripts/**' \
               ':!apps/mobile/lib/features/secrets_rotation_gate/**'

  migration-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: no timestamp journal paths in tests
        run: |
          ! grep -r "microsecondsSinceEpoch}_journal" test/ || (echo "timestamp journal paths remain" && exit 1)
      - name: mobile clean working tree script
        run: bash ../../scripts/validate-mobile-clean-working-tree.sh

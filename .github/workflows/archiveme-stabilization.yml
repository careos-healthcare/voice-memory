name: ArchiveMe stabilization

on:
  push:
    branches: [main, 'cursor/**', archive-me/focused-beta-stabilization]
  pull_request:
    branches: [main, archive-me/focused-beta-stabilization]

concurrency:
  group: archiveme-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: npm ci integrity
        id: install
        run: npm ci --ignore-scripts

      # Guarded with `!cancelled() && install succeeded` rather than the default
      # fail-fast. Under fail-fast, root `npm run lint` failed on one error and
      # skipped the eight steps below it — server build, auth security, privacy
      # logs, the insight gate, three restraint validators and the clinical
      # audit had therefore never executed once, and nothing in the UI said so.
      # A skipped guard and a passing guard must not look the same.
      - name: TypeScript check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Server build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:server
      - name: Server tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate:auth-security
      # The old `|| node scripts/validate-privacy-logs.mjs` fallback re-ran the
      # exact command `npm run validate:privacy-logs` already runs, so it could
      # only ever fail twice and print the failure twice.
      - name: Privacy log validation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate:privacy-logs
      - name: Insight quality gate (PRD Goal #4 — ordered validators)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate:insight-quality-gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Product restraint (consolidated)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate:restraint
      - name: Blind-spot validation (consolidated)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate:blind-spot
      - name: Resurfacing validation (consolidated)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate:resurfacing
      - name: Clinical quarantine audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run validate:clinical-quarantine

  flutter-gates:
    runs-on: ubuntu-latest
    # Job backstop: a hung suite fails the whole job in ~2h instead of silently
    # burning the 6h GitHub ceiling. The per-step timeout below catches the
    # common case (the full test suite) much faster.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        id: pubget
        run: flutter pub get

      # Same reasoning as server-gates above. Under fail-fast, `analyzer baseline`
      # failing on pre-existing analyzer errors skipped the six steps below it,
      # including every step that runs tests. A skipped gate and a passing gate
      # must not look the same, so each gate reports its own outcome.
      - name: Audit silent catch blocks
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: python3 tool/run_gate.py audits silent_catches
      - name: dart format check
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: dart format --output=none --set-exit-if-changed lib test
      - name: analyzer baseline
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: bash tool/validate_analyzer_baseline.sh
      - name: research import guard
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: bash tool/validate_no_research_imports.sh
      - name: feature module count budget
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: python3 tool/run_gate.py budget
      - name: V1 production graph and permissions
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: bash tool/validate_v1_production_graph.sh
      # validate_core.sh runs the full suite, but only after its own analyzer gate,
      # which currently fails on pre-existing errors — so the suite was unreachable
      # even once the script was back in place. This step reports the suite directly.
      # A healthy full suite runs in ~65 min. timeout-minutes hard-fails a hung
      # run fast and visibly (~90m) instead of hanging to the 6h ceiling;
      # --timeout 5m fails an individual runaway test even faster where flutter
      # honors it. If this step is cancelled by timeout, the offending suite is
      # the one with no completion output before the cut-off.
      - name: flutter test (full suite)
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        timeout-minutes: 90
        run: flutter test --timeout 5m
      - name: validate core (analyzer + full test suite + release gates)
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: bash tool/validate_core.sh
      - name: Insight-science theory dart suites
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: flutter test test/archive_theory_engine_test.dart test/theory_ranking_engine_test.dart test/archive_agreement_service_test.dart test/archive_primary_theory_validation_test.dart test/archive_quality_validation_test.dart
      - name: repository cleanliness
        if: ${{ !cancelled() && steps.pubget.outcome == 'success' }}
        run: bash tool/validate_repository_cleanliness.sh

  flutter-android:
    runs-on: ubuntu-latest
    needs: flutter-gates
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android debug build
        run: flutter build apk --debug

  flutter-ios:
    runs-on: macos-latest
    needs: flutter-gates
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pod install
        run: |
          cd ios
          pod install
      - name: iOS simulator build (no signing)
        run: flutter build ios --simulator --no-codesign

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret pattern scan
        run: |
          ! git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk_live_[A-Za-z0-9]{8,}|AKIA[0-9A-Z]{16})' \
            -- ':!*.md' ':!package-lock.json' ':!pubspec.lock' \
               ':!.github/**' ':!**/test/**' ':!scripts/**' \
               ':!apps/mobile/lib/features/secrets_rotation_gate/**'

  migration-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: no timestamp journal paths in tests
        run: |
          ! grep -r "microsecondsSinceEpoch}_journal" test/ || (echo "timestamp journal paths remain" && exit 1)
      - name: mobile clean working tree script
        run: bash ../../scripts/validate-mobile-clean-working-tree.sh

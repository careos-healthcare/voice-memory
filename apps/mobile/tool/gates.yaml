# Manifest for `python3 tool/run_gate.py <section> <name>`.
# CI and local checks should prefer run_gate.py over one-off shell wrappers.

gates:
  analyze:
    description: Run Flutter static analysis and lint checks
    command: flutter analyze
  test:
    description: Execute unit and widget test suite
    command: flutter test
  format:
    description: Check Dart code formatting
    command: dart format --output=none --set-exit-if-changed .
  budget:
    description: Enforce repository directory and file budgets
    command: python3 tool/enforce_budget.py

audits:
  silent_catches:
    description: Fail on catch blocks that swallow errors without logging or rethrow
    command: dart run tool/audit_silent_catches.dart

validates:
  api_contract:
    description: Validate mobile API client contract parity
    command: dart run tool/validate_api_contract.dart
  analysis_excludes:
    description: >
      Fail when the generated lib/features exclude block drifts from the symlinks
      on disk. Drift silently changes what the analyzer sees, which makes every
      issue-count comparison against a baseline meaningless.
    command: python3 tool/check_analysis_excludes.py
  null_check_operator_guards:
    description: >
      Fail on the `X! != null` / `X! == null` anti-pattern — a null-check
      operator (`!`) inside a null guard throws `Null check operator used on a
      null value` the moment the operand is null. The analyzer flags it
      (unnecessary_null_comparison), but analysis_options excludes the whole
      lib/features/* -> retired_sprawl symlink tree, which the app still ships
      and ~1,000 test files still execute — exactly how this crashed RecordScreen
      undetected. Walks the source directly (followlinks) so it covers that
      excluded tree; self-tests its matcher first.
    command: python3 tool/check_null_check_operator_guards.py
  initstate_provider_writes:
    description: >
      Fail when a widget build-phase life-cycle can synchronously reach a
      Riverpod notifier method that writes `state` before its first await.
      ProviderScope only installs that check in debug, so these never break a
      release build — they just silently skip the work they were meant to start.
      Walks the source directly so it also covers the analyzer-excluded
      retired_sprawl symlinks, which the app still ships.
    command: python3 tool/check_initstate_provider_writes.py
  ios_sources_phase:
    description: >
      Fail when a Swift file in ios/Runner is not listed in the Runner target's
      Sources build phase. Xcode compiles the phase, not the directory, so such
      a file is silently absent from the binary and the failure surfaces far
      from its cause — or not at all, as a channel handler that is simply never
      registered. Pure Python, no Xcode required.
    command: python3 tool/check_ios_sources_phase.py
  ios_deployment_target:
    description: >
      Fail when an iOS plugin requires a newer iOS than the app's deployment
      target. Reads both plugin systems — `.iOS(...)` from SPM Package.swift
      manifests and `ios.deployment_target`/`platform :ios` from podspecs —
      because the Podfile post_install hook overwrites each pod's own
      requirement, so a CocoaPods plugin under the target fails at compile time
      rather than at `pod install`. Checking one system silently under-reports.
      Needs `.flutter-plugins-dependencies`, so run after pub get.
    command: python3 tool/check_ios_deployment_target.py
  copy_render_path:
    description: >
      Fail when a privacy/trust copy constant newly loses its last live render
      path. Scoped to the sources the privacy copy scanner already discovers.
      A claim no user can reach is not a disclosure, and citing one as
      evidence offers a reviewer something they cannot check by using the app.
    command: python3 tool/check_copy_render_path.py
  mobile_privacy_logs:
    description: >
      Scan the release production graph for banned log fragments — raw
      transcripts, bearer tokens and audio paths must never reach release
      logs. Fails when the scan set is empty, so a moved scan root cannot
      read as a clean pass.
    command: dart run tool/validate_mobile_privacy_logs.dart
  privacy_copy:
    description: >
      Scan every discovered privacy/trust copy source for unsafe promises.
      Runs without flutter_test so it gates even while the widget suite is
      broken.
    command: dart run tool/privacy/check_privacy_copy_policy.dart

self_tests:
  api_dto:
    description: API DTO serialization self-tests
    command: flutter test tool/run_api_dto_self_test.dart
  pro_status:
    description: Pro status SQLite self-tests
    command: flutter test tool/run_pro_status_self_test.dart


legacy_checks:
  audit_v1_launch_product:
    description: Launch-product focus audit — surfaces, copy, and startup aligned to V1 contract.
    command: bash tool/audit_v1_launch_product.sh

  audit_v1_permissions:
    description: Validates native permission declarations against V1CapabilityRegistry.
    command: bash tool/audit_v1_permissions.sh

  audit_v1_service_locator:
    description: Fails if V1 critical-path sources reference AppServices.instance directly.
    command: bash tool/audit_v1_service_locator.sh

  validate_v1_production_graph:
    description: Enforces V1 production dependency graph — routes, modules, imports, deep links.
    command: bash tool/validate_v1_production_graph.sh

  validate_repository_cleanliness:
    description: Records Git status, runs a test command, and fails if the working tree changed.
    command: bash tool/validate_repository_cleanliness.sh

  validate_no_research_imports:
    description: Fail if production lib/ imports the non-shipping research package.
    command: bash tool/validate_no_research_imports.sh

  validate_core:
    description: Core validation for ArchiveMe mobile.
    command: bash tool/validate_core.sh

  run_commercial_proof_executor:
    description: Commercial proof executor v1 — one executable release checklist.
    command: bash tool/run_commercial_proof_executor.sh

  run_pro_access_enforcement_audit:
    description: Pro access enforcement audit v3 — store readiness bridge + CI enforcement bundle.
    command: bash tool/run_pro_access_enforcement_audit.sh

  run_product_language_consistency_guard:
    description: Product language consistency guard v1 — proof-trail language wins in core surfaces.
    command: bash tool/run_product_language_consistency_guard.sh

  run_revenuecat_live_proof_checklist:
    description: RevenueCat live proof runner v1 — automated checklist + missing-key guard.
    command: bash tool/run_revenuecat_live_proof_checklist.sh

  run_core_metrics_minimum_set:
    description: Core metrics minimum set v2 — classifier, dashboard wiring, and CI bundle.
    command: bash tool/run_core_metrics_minimum_set.sh

  run_first_proof_field_readiness:
    description: First proof field readiness v1 — beta measurement and repair routing only.
    command: bash tool/run_first_proof_field_readiness.sh

  run_physical_device_release_smoke:
    description: Physical device smoke proof v1 — automated checklist + RevenueCat no-crash guard.
    command: bash tool/run_physical_device_release_smoke.sh

  run_value_clarity_screenshot_export:
    description: Value-clarity PNGs — fails in ~45s if headless toImage hangs (use simulator + manual capture as fallback).
    command: bash tool/run_value_clarity_screenshot_export.sh

  analyze_production_graph:
    description: Analyzer gate for the focused-beta production graph — zero errors and warnings.
    command: bash tool/analyze_production_graph.sh

  validate_android_release_signing:
    description: Release gate: Android release builds must never fall back to the debug keystore.
    command: bash tool/validate_android_release_signing.sh

  validate_no_stray_test_artifacts:
    description: Fails when flutter test leaves stray JSON artifacts in the package root.
    command: bash tool/validate_no_stray_test_artifacts.sh

# Manifest for `python3 tool/run_gate.py <section> <name>`.
# CI and local checks should prefer run_gate.py over one-off shell wrappers.

gates:
  analyze:
    description: Run Flutter static analysis and lint checks
    command: flutter analyze
  test:
    description: Execute unit and widget test suite
    command: flutter test
  format:
    description: Check Dart code formatting
    command: dart format --output=none --set-exit-if-changed .
  budget:
    description: Enforce repository directory and file budgets
    command: python3 tool/enforce_budget.py

audits:
  silent_catches:
    description: Fail on catch blocks that swallow errors without logging or rethrow
    command: dart run tool/audit_silent_catches.dart

validates:
  api_contract:
    description: Validate mobile API client contract parity
    command: dart run tool/validate_api_contract.dart

self_tests:
  api_dto:
    description: API DTO serialization self-tests
    command: dart run tool/run_api_dto_self_test.dart
  pro_status:
    description: Pro status SQLite self-tests
    command: dart run tool/run_pro_status_self_test.dart


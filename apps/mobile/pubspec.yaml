  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  record: ^6.0.0
  audioplayers: ^6.4.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  crypto: ^3.0.7
  cryptography: ^2.7.0
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.6
  firebase_messaging: ^15.1.6
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  purchases_flutter: ^8.1.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  purchases_ui_flutter: ^8.1.0
  web_socket_channel: ^3.0.3
  audio_session: ^0.2.4
  flutter_riverpod: ^2.6.1
  encrypt: ^5.0.3
  image_picker: ^1.2.3
  image: ^4.5.4
  flutter_onnxruntime: ^1.8.1
  archive: ^4.0.7
  dio: ^5.8.0+1
  retrofit: ^4.9.2
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  fpdart: ^1.1.0
  sqlite_vector: ^1.0.0
  device_calendar: ^4.3.3
  health: ^12.0.1


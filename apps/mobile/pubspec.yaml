# ARCHITECTURE NOTE — see IDENTIFIERS.md for the full policy:
#   • Dart package `name:` → archiveme_mobile (developer/build identity).
#   • Legacy identifiers kept: bundle ID (com.voicememory.mobile), storage keys,
#     deep links, and backend migration paths — do not rename without IDENTIFIERS.md migration plan.
#   • User-facing branding everywhere else → ArchiveMe.
name: archiveme_mobile
description: ArchiveMe native iOS/Android — MVP core loop (record, transcribe, analyze, local journal).
publish_to: "none"

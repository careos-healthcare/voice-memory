  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
  build_runner: ^2.4.15
  retrofit_generator: ^10.0.0
  json_serializable: ^6.9.4
  freezed: ^3.0.0
  yaml: ^3.1.3
  sqflite_common_ffi: ^2.3.5
  archiveme_research:
    path: ../../packages/archiveme_research

  path_provider_platform_interface: any
  plugin_platform_interface: any

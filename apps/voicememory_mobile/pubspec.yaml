name: voicememory_mobile
description: ArchiveMe native iOS/Android — MVP core loop (record, transcribe, analyze, local journal).
publish_to: "none"
version: 0.2.0+49

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.8.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  record: ^6.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.6
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  purchases_flutter: ^10.4.3
  local_auth: ^3.0.1
  connectivity_plus: ^6.1.4
  flutter_riverpod: ^3.3.2
  sqlite3: ^3.5.0
  path: ^1.9.1
  whisper_flutter_coreml: ^1.0.1
  secure_application: ^4.1.0
  pointycastle: ^4.0.0
  http_parser: ^4.1.2
  intl: any
  just_audio: ^0.10.6
  archive: ^4.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - config/backend_url.txt
    - assets/fonts/NotoSerif.ttf
    - assets/fonts/OFL.txt

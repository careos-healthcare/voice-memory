name: voicememory_mobile
description: VoiceMemory native iOS/Android — MVP core loop (record, transcribe, analyze, local journal).
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  record: ^6.0.0
  share_plus: ^10.1.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

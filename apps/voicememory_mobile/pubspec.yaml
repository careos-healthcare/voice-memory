name: voicememory_mobile
description: ArchiveMe native iOS/Android — MVP core loop (record, transcribe, analyze, local journal).
publish_to: "none"
version: 0.2.0+21

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  record: ^6.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.6
  firebase_messaging: ^15.1.6
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0
  purchases_flutter: ^8.1.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - config/backend_url.txt
